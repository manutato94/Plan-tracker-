<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Plan" />
  <title>Plan</title>

  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="apple-touch-icon" href="./logo_180.png" />
  <link rel="manifest" href="./manifest.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      background: radial-gradient(circle at 50% 45%, #29292E 0%, #1A1A1F 55%, #0D0D0F 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px;
      transition: opacity 0.4s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 96px; height: 96px; }
    #splash .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid rgba(198, 244, 50, 0.2);
      border-top-color: #C6F432;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="./logo.svg" alt="" />
    <div class="spinner"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
